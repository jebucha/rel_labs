---
# Arranges the Ascender state that a scenario in tests/run-scenario.sh assumes.
#
# Run against the same instance and credentials as the playbook itself:
#   ansible-playbook tests/scenario_state.yml -e scenario=T-ASCENDER-INVENTORY-BOOTSTRAP-002
#
# -001 needs no inventory (its sources go with it), -002 needs the inventory
# without the source, and -003/-004/-006/-007 need both present and queryable.
# -005 runs against tests/stub_ascender.py and needs no state here.
- name: Arrange Ascender state for a scenario
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    inventory_name: "20031 Inventory"
    source_name: "20031-source"
    organization_name: "20031"
    known_scenarios:
      - T-ASCENDER-INVENTORY-BOOTSTRAP-001
      - T-ASCENDER-INVENTORY-BOOTSTRAP-002
      - T-ASCENDER-INVENTORY-BOOTSTRAP-003
      - T-ASCENDER-INVENTORY-BOOTSTRAP-004
      - T-ASCENDER-INVENTORY-BOOTSTRAP-005
      - T-ASCENDER-INVENTORY-BOOTSTRAP-006
      - T-ASCENDER-INVENTORY-BOOTSTRAP-007
  tasks:
    - name: Require a scenario id
      ansible.builtin.assert:
        that:
          - scenario is defined
          - scenario in known_scenarios
        fail_msg: "Pass -e scenario=<T-ASCENDER-INVENTORY-BOOTSTRAP-NNN>; known: {{ known_scenarios | join(', ') }}"
        quiet: true

    - name: "Scenario -001: no inventory (deleting it removes its sources)"
      when: scenario == 'T-ASCENDER-INVENTORY-BOOTSTRAP-001'
      ctrliq.ascender.inventory:
        name: "{{ inventory_name }}"
        organization: "{{ organization_name }}"
        state: absent

    - name: "Scenario -002: inventory present, source absent"
      when: scenario == 'T-ASCENDER-INVENTORY-BOOTSTRAP-002'
      block:
        - name: Ensure the inventory exists
          ctrliq.ascender.inventory:
            name: "{{ inventory_name }}"
            organization: "{{ organization_name }}"
            state: present
        - name: Remove the inventory source
          ctrliq.ascender.inventory_source:
            name: "{{ source_name }}"
            inventory: "{{ inventory_name }}"
            organization: "{{ organization_name }}"
            state: absent

    - name: "Scenarios -003/-004/-006/-007: inventory and source present and queryable"
      when: scenario in ['T-ASCENDER-INVENTORY-BOOTSTRAP-003', 'T-ASCENDER-INVENTORY-BOOTSTRAP-004',
                         'T-ASCENDER-INVENTORY-BOOTSTRAP-006', 'T-ASCENDER-INVENTORY-BOOTSTRAP-007']
      block:
        - name: Ensure the inventory exists
          ctrliq.ascender.inventory:
            name: "{{ inventory_name }}"
            organization: "{{ organization_name }}"
            state: present
        - name: Ensure the inventory source exists
          ctrliq.ascender.inventory_source:
            name: "{{ source_name }}"
            description: "{{ inventory_name }}"
            source_path: "inventory/hosts.yml"
            source: "scm"
            source_project: "rel_labs"
            inventory: "{{ inventory_name }}"
            overwrite: true
            organization: "{{ organization_name }}"
            update_on_launch: true
