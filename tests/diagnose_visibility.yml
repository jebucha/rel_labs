---
# Ad-hoc diagnostics for the visibility waits in build_inventory.yml.
# Run against a live Ascender:  ansible-playbook tests/diagnose_visibility.yml
#
# Dumps the raw list-view payloads the waits consume, so id serialization
# (string vs integer) and server-side `name` filter behaviour are visible.
# The waits now match name + parent locally with string comparison, but this
# file is the ground truth if a wait ever misbehaves again.
- name: Dump the payloads the visibility waits consume
  hosts: localhost
  gather_facts: false
  tasks:
    - name: All organizations (unfiltered)
      ansible.builtin.debug:
        msg: >-
          organizations:
          {{ lookup('ctrliq.ascender.controller_api', 'organizations',
                    wantlist=True) | to_json }}

    - name: Organizations with plain name filter
      ansible.builtin.debug:
        msg: >-
          organizations name=20031:
          {{ lookup('ctrliq.ascender.controller_api', 'organizations',
                    query_params={'name': '20031'},
                    wantlist=True) | to_json }}

    - name: All inventories (unfiltered)
      ansible.builtin.debug:
        msg: >-
          inventories:
          {{ lookup('ctrliq.ascender.controller_api', 'inventories',
                    wantlist=True) | to_json }}

    - name: Inventories with plain name filter
      ansible.builtin.debug:
        msg: >-
          inventories name=20031 Inventory:
          {{ lookup('ctrliq.ascender.controller_api', 'inventories',
                    query_params={'name': '20031 Inventory'},
                    wantlist=True) | to_json }}

    - name: All inventory sources (unfiltered)
      ansible.builtin.debug:
        msg: >-
          inventory_sources:
          {{ lookup('ctrliq.ascender.controller_api', 'inventory_sources',
                    wantlist=True) | to_json }}

    - name: Inventory sources with plain name filter
      ansible.builtin.debug:
        msg: >-
          inventory_sources name=20031-source:
          {{ lookup('ctrliq.ascender.controller_api', 'inventory_sources',
                    query_params={'name': '20031-source'},
                    wantlist=True) | to_json }}
