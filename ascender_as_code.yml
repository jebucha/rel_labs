---
- name: Master playbook to build out elements in Ascender
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:

    - name: Include inventory task
      ansible.builtin.include_tasks: build_inventory.yml

    - name: Deploy Prometheus Job Template
      ctrliq.ascender.job_template:
        name: deploy_prometheus_server
        job_type: "run"
        organization: "20031"
        project: "rel_labs"
        inventory: "20031 Inventory"
        # Placeholder: the only playbook the lab project's (incomplete)
        # list view currently accepts. The template's real target is
        # deploy_prometheus.yml — to be finalized in the follow-up change
        # that specs this task's contract.
        playbook: "deploy_prometheus.yml"
        credentials:
          - ascender_machine_key
          - ascender_api
        allow_simultaneous: true
        ask_credential_on_launch: true
        ask_job_type_on_launch: true
        ask_limit_on_launch: true

    - name: Create Rocky10 VM Job Template
      ctrliq.ascender.job_template:
        name: create_rocky10_vm
        job_type: "run"
        organization: "20031"
        project: "rel_labs"
        inventory: "20031 Inventory"
        playbook: "create_rocky_vm.yml"
        credentials:
          - ascender_machine_key
        allow_simultaneous: false
        ask_job_type_on_launch: true
        survey_enabled: true
        survey_spec:
          name: "Create Rocky VM Vars"
          description: "VM Vars"
          spec:
            - question_name: "VM Name"
              question_description: "Enter hostname for new VM"
              variable: "libvirt_vm_name"
              type: "string"
              required: true
            - question_name: "VM State"
              question_description: "Create or Destroy"
              variable: "libvirt_vm_state"
              type: "multichoice"
              choices:
                - "present"
                - "absent"
              required: true
              default: "present"
            - question_name: "Domain name"
              question_description: "Enter domain name"
              variable: "libvirt_vm_domain"
              type: "string"
              required: "true"
              default: "jebucha.com"
            - question_name: "VM Memory"
              question_description: "Ram allocation"
              variable: "libvirt_vm_memory_mb"
              type: "number"
              required: "true"
              default: "2"
            - question_name: "Vcpu Count"
              question_description: "How many CPUs"
              variable: "libvirt_vm_vcpus"
              type: "number"
              required: "true"
              default: "2"
            - question_name: "Disk Size"
              question_description: "Disk Size in GB"
              variable: "libvirt_vm_disk_gb"
              type: "number"
              required: "true"
              default: "30"
            - question_name: "VM Bridge"
              question_description: "Bridge0 or Bridge1"
              variable: "libvirt_vm_bridge"
              type: "string"
              required: "true"
              default: "bridge0"
