# ansible.cfg – minimal project configuration
# NOTE: ansible.cfg does NOT support inline `#` comments — they become part of
# the value (this previously created a literal "collections   # ..." directory).
# Keep comments on their own lines.

[defaults]
# Local inventory directory
inventory = ./inventory
host_key_checking = False

# Where `ansible-galaxy install -r requirements.yml` puts roles/collections
roles_path = ./roles
collections_path = ./collections

