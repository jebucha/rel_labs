---
- name: Create default inventory
  ctrliq.ascender.inventory:
    name: "20031 Inventory"
    description: "My Default Inventory"
    organization: "20031"
    state: present

# The ctrliq.ascender create modules return as soon as the API accepts the
# POST (201), before the new object is queryable. Every create is therefore
# followed by a visibility wait that polls the list view (30 attempts x 2s)
# before the next task looks the object up by name.
#
# The wait is shared: both call sites include tasks/wait_visible.yml with
# include vars for the endpoint, the object name, the parent attribute,
# the parent id, and the phrase used in the failure message, so the
# polling predicate, the retry budget, and the failure reporting exist
# exactly once, in that file.
#
# The predicate lives in `until`, which Ansible re-evaluates on every
# attempt (task arguments would be templated only once); it matches the
# object's name and parent (organization, and inventory for sources) from
# the returned payload, with both sides of the parent comparison
# stringified, so a same-named object elsewhere cannot satisfy the wait.
# If the object never appears, the shared wait's rescue fails the play
# with a descriptive message, so the dependent task never runs.

# The name is matched locally as well: if the list view ever ignores the
# `name` query param, `first` would otherwise pick an arbitrary organization.
# A missing organization makes `first` fail this named task.
- name: Resolve the 20031 organization id
  ansible.builtin.set_fact:
    __ascender_org_id: "{{ (lookup('ctrliq.ascender.controller_api', 'organizations',
                                   query_params={'name': '20031'},
                                   wantlist=True)
                            | selectattr('name', 'equalto', '20031'))
                            | map(attribute='id') | first }}"

- name: Wait for 20031 Inventory to be visible in Ascender
  ansible.builtin.include_tasks: tasks/wait_visible.yml
  vars:
    __wait_endpoint: inventories
    __wait_name: "20031 Inventory"
    __wait_parent_attr: organization
    # Templated so the include var carries the resolved id (a bare
    # __ascender_org_id would pass through as that literal string, and the
    # predicate could never match the numeric id).
    __wait_parent_id: "{{ __ascender_org_id }}"
    __wait_scope: "organization 20031"

- name: Add 20031 inventory source
  ctrliq.ascender.inventory_source:
    name: "20031-source"
    description: "20031 Inventory"
    source_path: "inventory/hosts.yml"
    source: "scm"
    source_project: "rel_labs"
    inventory: "20031 Inventory"
    overwrite: true
    organization: "20031"
    update_on_launch: true

# Resolved the way the collection's own modules resolve it: a server-side
# name + organization filter (proven by the create tasks above), with the
# name re-checked locally so a misbehaving filter cannot select an arbitrary
# inventory of the organization.
- name: Resolve the 20031 Inventory id
  ansible.builtin.set_fact:
    __ascender_inventory_id: "{{ (lookup('ctrliq.ascender.controller_api', 'inventories',
                                          query_params={'name': '20031 Inventory',
                                                        'organization': __ascender_org_id},
                                          wantlist=True)
                                  | selectattr('name', 'equalto', '20031 Inventory') | first).id }}"

- name: Wait for 20031-source to be visible in Ascender
  ansible.builtin.include_tasks: tasks/wait_visible.yml
  vars:
    __wait_endpoint: inventory_sources
    __wait_name: "20031-source"
    __wait_parent_attr: inventory
    # Templated so the include var carries the resolved id (a bare
    # __ascender_inventory_id would pass through as that literal string, and
    # the predicate could never match the numeric id).
    __wait_parent_id: "{{ __ascender_inventory_id }}"
    __wait_scope: "inventory 20031 Inventory"

- name: Update 20031 inventory
  ctrliq.ascender.inventory_source_update:
    name: "20031-source"
    inventory: "20031 Inventory"
    organization: "20031"
